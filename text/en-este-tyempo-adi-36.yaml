titulo: En este tyempo - Adi 36
pub: 2026.07.02
source: https://ladinokomunita.groups.io/g/main/message/76171

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 36.
    ebreo: עדי 36.
  - ladino: Moshe Ridler era sovrebivyente del Holokosto. Teniya 92 anyos. Konosido komo "El nono del kibutz Holit". Moshe i su kudyador de Moldova, Petro Baskov, biviyan en una kaza alokada djusto al lado de la bariera. Los terroristos tiraron una roketa de RPG a la ventana de de sus Kamareta de Abrigo, entraron a la kaza i echaron bomba de mano. Moshe muryo en su kama, Petro se kijo fuyir, lo tiraron de la kavesa i lo mataron.
    ebreo: משה רידר היה ניצול שואה. היה בן 92. מוכר כ"הסבא של קיבוץ חולית". משה והמטפל שלו ממולדובה, פטרו בסקוב, חיו בבית הממוקם בדיוק ליד הגדר. הטרוריסטים ירו רקטת RPG לחלון הממ"ד, נכנסו לבית וזרקו רימון. משה מת במיטתו, פטרו רצה לברוח ירו לו בראש והרגו אותו.
  - ladino: Lo echas por la Puerta, entra por la ventana.
    ebreo: אתה זורק/מגרש אותו מהדלת, נכנס מהחלון.


