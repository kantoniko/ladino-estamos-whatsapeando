titulo: En este tyempo - Adi 44
pub: 2026.07.21
source: https://ladinokomunita.groups.io/g/main/message/76289

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 44.
    ebreo: עדי 44.
  - ladino: "La madre i la ermana de Dr. Ronit Tal Sultan, Turistos de Argentina, estavan en Israel en la kaza de Ronit i Rolan Sultan. Vyernes dospues de la media noche teniyan de tornar a Argentina. Rolan las tomo al airoporto i torno al kibuts Holit a las 6:20 de la demanyana. El ijo Adam i la elmuera Nir, de Ronit i Rolan, moravan en Holit Tambien. A las 7:57 de la demanyana vino el mesaj de alkavo. Ronit les eskrivyo: \"Voz kero Bien\". A Rolan lo toparon Muerto afuera de kaza. A Ronit la toparon muerta afuera de la Kamareta de Abrigo. Los teroristos los tiraron kon kurshumes i patladaron eksplusivos."
    ebreo: "אמה ואחותה של ד\"ר רונית סולטן, תיירים מארגנטינה, היו בישראל בביתם של רונית ורולאן סולטן. יום שישי לאחר חצות היו צריכות לחזור לארגנטינה. רולאן לקח אותן לשדה תעופה וחזר לקיבות חולית ב- 6:20 של הבוקר. הבן אדם והכלה ניר של רונית ורולאן גרו בחולית גם. בשעה 7:57 של הבוקר הגיעה ההודעה האחרונה. רונית כתבה להם \"אני אוהבת אתכם\". את רולאן מצאו מת מחוץ לבית. את רונית מצאו מתה מחוץ לממ\"ד. המחבלים ירו בהם בכתורים ופוצצו מטענים."
  - ladino: El Ijo Adam aresivyo el doktorato de filosofiya de su madre sovre "El rolo del arte en el protesto", dospues de su muerte.
    ebreo: הבן אדם קיבל את הדוקטורט לפילוסופיה של אימו על "תפקידה של האומנות במחאה" לאחר מותה.
  - ladino: Ambezate el arte i metelo aparte.
    ebreo: למד את האומנות ושים אותו בצד.




