titulo: En este tyempo - Adi 56
pub: 2026.08.18
source: https://ladinokomunita.groups.io/g/main/message/76416

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 56.
    ebreo: עדי 56.
  - ladino: El Dyo le dyo a Avital, la eroina, munchas fuersas. El ir i vinir, a pye, eskondyendo de teroristos en kamino, detenyendo las kriyaturas en las manos, sin komer, sin bever, konsolandolos ke todo se va a eskapar en serka, enkorajandolos ke estan tornando a sus paryentes.. todo esto les tomo mas de 5 oras. Ayegaron a Holit muertos de la kanserya, del espanpanto, de dolores, de ser i de ambre.
    ebreo: אלוהים נתן לאביטל, הגיבורה, כוחות רבים. ההלוך והחזור, ברגל, כשמתחבאים מהמחבלים בדרך, כשמחזיקה את הילדים בידיים, בלי לאכול, בלי לשתות, כשהיא מנחמת אותם שהכל ייגמר בקרוב, כשהיא מעודדת אותם שהם חוזרים להורים שלהם.. כל זה לקח יותר מ- 5 שעות. הגיעו לחולית מתים מעייפות, מפחד, מכאבים, מצמא ומרעב...
  - ladino: Negev kijo mansana le dyeron dos.
    ebreo: נגב רצה תפוח נתנו לו שניים.
  - ladino: Aki tenesh dos filmikos.
    ebreo: כאן יש לכם 2 סרטונים.
