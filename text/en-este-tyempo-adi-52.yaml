titulo: En este tyempo - Adi 52
pub: 2026.08.09
source: https://ladinokomunita.groups.io/g/main/message/76370

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 52.
    ebreo: עדי 52.
  - ladino: 'Tornaremoz a las oras 12:30 de midi. Los teroristos desbrocharon la kaza de Adi. Negev, de 3 anyos i 9 mezes, konto este modo lo ke les afito: "Vinyeron soldados malos kon burakador i burakaron la kaza. Kale adovar la kaza. I mama teniya burakador. Kijyeron burakar a Eshel, mama no los desho. Mama moz disho ke moz kere muncho bien, ke serremoz los ojos i ke los avremoz kuando va aver luz. I se fue.".'
    ebreo: 'נחזור לשעה 12.30. המחבלים פרצו לבית של עדי. נגב, בן 3 שנים ו-9 חודשים סיפר כך את מה שארעה להם: "הגיעו חיילים רעים עם מקדחה וקדחו את הבית. צריך לתקן את הבית. גם לאמא הייתה מקדחה. הם רצו לקדוח את אשל. אמא לא נתנה להם. אמא אמרה לנו שאוהבת אותנו מאוד, שנעצום את העיניים ושנפקח אותם כשיהיה אור.  והלכה..."'
  - ladino: Kere saver el klavo el burako i ande se va a enklavar.
    ebreo: רוצה לדעת את המסמר, את החור, ואיפה לדפוק את המסמר.


