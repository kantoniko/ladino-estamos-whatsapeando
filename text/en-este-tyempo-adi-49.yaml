titulo: En este tyempo - Adi 49
pub: 2026.08.03
source: https://ladinokomunita.groups.io/g/main/message/76343

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 49.
    ebreo: עדי 49.
  - ladino: Yaron salyo de la Kamareta de Abrigo para entender lo ke esta afitando. Oyo ekplozuras i tiros de la vanda de la kaza de su ija. Oyo eksplozuras de la kaza de al lado, de la vanda syedra. Vido ke los teroristos estan tirando a las ventanas de su kaza. Entendyo ke vino la sira suya i ke esta para murirse.
    ebreo: ירון יצא מהממ"ד בכדי להבין מה קורה. שמע פיצוצים ויריות מהכיוון של הבית של עדי. שמע פיצוצים מהבית לידו, בצד שמאל. ראה שהמחבלים יורים על חלונות ביתו. הבין שהגיע תורו ושהוא עומד למות.
  - ladino: Los teroristos no entraron a su kaza. Saviyan ke esta kaza es de musafires i es vaziya. Entraron a la kaza de la vanda derecha.
    ebreo: המחבלים לא נכנסו לביתו. ידעו שזה בית לאורחים והוא ריק. נכנסו לבית בצד ימין.
  - ladino: 'A las 12:30 vino el ultimo mesaj de su ija Adi: "Esbrocharon a mi kaza. Tu kale ke salgas de aki bivo. Serra la puerta i kudyate!".'
    ebreo: 'ב- 12.30 הגיע ההודעה האחרונה מביתו עדי: "פרצו לביתי. אתה צריך לצאת מפה חי. סגור את הדלת ושמור על עצמך!".'
  - ladino: Al malo, tomalo de la mano i mete kudyado.
    ebreo: את הרע, כך בידו ושים לב אליו.



