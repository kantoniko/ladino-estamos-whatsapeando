titulo: En este tyempo - Adi 57
pub: 2026.08.20
source: https://ladinokomunita.groups.io/g/main/message/76420

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 57.
    ebreo: עדי 57.
  - ladino: Anani i su grupo fueron salvados a las 20.00 de la tadre. Los sovrebivyentes de Holit fueron arekojidos en Kibuts Gvulot i transferados a kibuts Eyn gedi.
    ebreo: את ענני והקבוצה שלו הצילו בשעה 20.00 בערב. השורדים מחולית נאספו בקיבוץ גבולות והועברו לקיבוץ עין גדי.
  - ladino: Tres dias dopues la armada Israeyana torno a Holit para entrar de kaza a kaza, de kamareta a kamareta.
    ebreo: שלושה ימים לאחר מכן הצבא הישראלי חזר לחולית בכדי להיכנס מבית לבית, מחדר לחדר.
  - ladino: Kuando vinyeron a la Kamareta de Abrigo de Adi i vyeron ke ay bomba de mano enkolgada en el mango de la puerta, desidaron de entrar de la ventana. Kuando entraron de la ventana vyeron mano de persona debasho de la kanape. I ke la kanape esta minada entera kon mas de 20 bombas de mano.
    ebreo: כשהגיעו לממ"ד של עדי וראו שיש רימון תלוי בידית של הדלת, החליטו להיכנס מהחלון. כשנכנסו מהחלון ראו יד של אדם מתחת לספה. ושהספה ממולכדת כולה ביותר מ- 20 רימונים.
  - ladino: Kuando ay pletos en kaza no se arekoje ni la siniza.
    ebreo: כשיש ריב בבית לא ניתן לאסוף אפילו אפר.




