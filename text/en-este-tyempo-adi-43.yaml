titulo: En este tyempo - Adi 43
pub: 2026.07.19
source: https://ladinokomunita.groups.io/g/main/message/76281

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 43.
    ebreo: עדי 43.
  - ladino: La ijika Adi mando mesaj a su tiya Liat ke esta aryentro del almaryo, ke no save kualo esta afitando kon su padre i su madre i ke su madre le disho ke no kite boz.
    ebreo: הילדה עדי שלחה הודעה לדודתה ליאת שהיא נמצאת בתוך הארון, שהיא לא יודעת מה קורה עם אבא שלה ועם אמא שלה ושאמא שלה אמרה לה לא להוציא קול. ליאת יצרה קשר עם פנינה ופנינה כתבה בחמ"ל שעדי נמצאת בארון.
  - ladino: Liat se metyo en kontakto kon Pnina i Pnina eskrivyo en el grupo de emerjensiya ke Adi esta en el almaryo. Naama i Gidon Kubani moravan serka. Naama le disho a Gidon ke tome su alma en su palma i ke se vayga a tomarla a Adi. Gidon tomo su revolver, koryo a la kaza de Liz i Meir, la travo a Liz de la puerta del almaryo, la tomo a la ijika es sus brasos i torno a kaza koryendo.
    ebreo: נעמה וגדעון כובני גרו קרוב. נעמה אמרה לגדעון שייקח את נפשו בכפו ושילך לקחת את עדי. גדעון לקח את האקדח שלו, רץ לבית של ליז ומאיר, משך את ליז מהדלת של הארון, לקח את הילדה בזרועותיו וחזר הביתה בריצה.
  - ladino: La unika palavra ke pudo dizir la ijika Adi era "Mersi".
    ebreo: המילה היחידה שהילדה עדי יכלה לומר היה "תודה".
  - ladino: Mijor amigo serkano, ke ermano leshano.
    ebreo: טוב יותר (עדיף) חבר קרוב מאח רחוק...





