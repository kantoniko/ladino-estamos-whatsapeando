titulo: En este tyempo - Adi 39
pub: 2026.07.09
source: https://ladinokomunita.groups.io/g/main/message/76216

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 39.
    ebreo: עדי 39.
  - ladino: Shahar i Shlomi Matias se konosyeron en el kolej de muzika, Rimon.  Los dos eran muzikantes. Tniyan dos ijikas Shir i Shaked i un ijo Rotem. Las ijas estavan en la "Kaza de Mansevos", en sus kamaretas. Shahar, Shlomi, Rotem i el perro "Marko" estavan en kaza, en la Kamareta de Abrigo. Shlomi estava detenyendo el mango del kavenado kon la mano, akel mango ke no se enkavena. La famiya mandaron mesaj al grupo de Pnina a las 7:47 ke los teroristos entraron a kaza i estan tirando aryentro de kaza. Este era el ultimo mesaj ke mandaron.
    ebreo: שחר ושלומי מתיאס הכירו במכללה למוזיקה, רימון. שניהם היו מוזיקאים. היו להם שתי בנות שיר ושקד ובן אחד רותם. הבנות היו בבית הצעירים, בחדריהן. שחר, שלומי, רותם והכלב "מרקו" היו בבית בממ"ד. שלומי החזיק את ידית המנעול בידיו, אותו מנעול שלא ננעל. המשפחה שלחה הודעה לקבוצה של פנינה ב- 7:47 שהטרוריסטים נכנסו לבית ויורים בתוך הבית. זאת הייתה ההודעה האחרונה ששלחו.
  - ladino: La esperansa es el ultimo ke se pyedre.
    ebreo: התקווה היא הדבר האחרון שמאבדים.





