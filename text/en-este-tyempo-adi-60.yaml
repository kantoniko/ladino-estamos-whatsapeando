titulo: En este tyempo - Adi 60
pub: 2026.08.27
source: https://ladinokomunita.groups.io/g/main/message/76448

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 60.
    ebreo: עדי 60.
  - ladino: Anani vino kon los ijikos a Yerushalayim i los ospitalizo en el ospital Shaari Tsedek. Avital, ke kreye ke los ijikos la salvaron, vino a Yarushalayim a ayudar a Anani.
    ebreo: ענני הגיע עם הילדים לירושלים ואשפז אותם בבית חולים שערי צדק. אביטל, שמאמינה שהילדים היצילו אותה, באה לירושלים לעזור לענני.
  - ladino: Oy, ogusto 2026, Holit dainda no se restoro. Anani, Avital i los ijikos biven en el asyento Sade Nitsan, en el sud. Avital ambeza pilatis. Anani, i su haver Eli, engrandesen un djenero espesyal de ananas, yamado "Ananas Adi", en el asyento Talmey Yosef.
    ebreo: היום, אוגוסט 2026 חולית עדיין לא שוקמה. ענני, אביטל והילדים גרים במושב שדה ניצן בדרום. אביטל מלמדת פילטיס. ענני והשותף שלו אלי מגדלים זן מסויים של אננס, הקרוי "אננס עדי", במושב תלמי יוסף.
  - ladino: "Si keresh enkomendar 'Ananas Adi' puedesh entrar al sityo: https://ananas-adi.co.il/"
    ebreo: "אם אתם רוצים להזמין 'אננס עדי' אתם יכולים להיכנס לאתר: https://ananas-adi.co.il/"
  - ladino: "Aki tenesh un filmiko:"
    ebreo: "כאן יש לכם סירטון:"
  - ladino: https://www.youtube.com/watch?v=GCLuTU4bVvc&t=786s
    ebreo: https://www.youtube.com/watch?v=GCLuTU4bVvc&t=786s
  - ladino: Ayudate i te ayudare.
    ebreo: עזור לעצמך ואעזור לך...



