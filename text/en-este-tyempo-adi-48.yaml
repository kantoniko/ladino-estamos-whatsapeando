titulo: En este tyempo - Adi 48
pub: 2026.07.30
source: https://ladinokomunita.groups.io/g/main/message/76328

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 48.
    ebreo: עדי 48.
  - ladino: Adi le telefono a Anani i le konto ke los teroristos estan entrando de kaza a kaza i matando a los de eryentro. Le disho ke le eksplike komo tomar el tiro de la kasha i ke le akodre komo se kullanea. Anani le ekspliko a Adi komo se karga el tiro i komo se tira.
    ebreo: עדי התקשרה לענני וספרה לו שהמחבלים נכנסים מבית לבית והורגים את אלה שבתוכם. אמרה לו שיסביר לה איך לקחת את הרובה מהכספת ושיזכיר לה איך להשתמש בו. ענני הסביר לעדי איך לטעון את הרובה ואיך לירות.
  - ladino: La vizina, Avital Aladjem, kontakto kon su vizino, Hayim Katsman, ke venga a su kaza para ke puedan enkorajar el uno al otro. Hayim salyo de su kaza i vino a la kaza de Avital.
    ebreo: השכנה, אביטל אלדג'ם, יצרה קשר עם השכן שלה, חיים כצמן, שיבוא לביתה בכדי שיוכלו לעודד האחד את השני. חיים יצא מביתו ובא לביתה של אביטל.
  - ladino: I el Dyo ke tenga kargo.
    ebreo: ושאלוהים ישמור.


