titulo: En este tyempo - Adi 59
pub: 2026.08.25
source: https://ladinokomunita.groups.io/g/main/message/76444

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 59.
    ebreo: עדי 59.
  - ladino: Adi esta inmortalizada en formas diferentes. El laboratoryo ke lavoro en la Universita de Beer Sheva se yama a su nombre. La universita kriyo un fondo de stependias a su nombre. En Kanada se kriyo fondo a su nombre para ijikos proves ke puedan partisipar en kampamientos de sport (JCC Sports Camp). Durante el terser partido de las Finales de la WNBA, el ekipo New York Liberty guadro un minuto de silensyo ofisial i izo un omenaje espesial en su memoria.
    ebreo: עדי מונצחת באופנים שונים. המעבדה שעבדה באוניברסיטת באר שבע נקראת על שמה. האוניברסיטה יצרה קרן מלגות על שמה. בקנדה הוקם קרן על שמה לילדים עניים שיוכלו להשתתף במחנות ספורט (JCC Sports Camp). בחלק השלישי של משחק הגמר בליגת נשים של NBA הקבוצה ניו יורק ליברטי קיימה דקת דומיה רשמית ומחוות הוקרה מיוחדת לזכרה.
  - ladino: I lo mas importante, el ospital Shiba realizo un program a su nombre. Este program reusho a kriyar una aplikasyon espesyal (MySequelCare) ke ayuda a kurar personas traumatikas i personas ke sufren de espantos i batimyentos.
    ebreo: והכי חשוב, בית חולים שיבא מימשה תכנית על שמה. תכנית זו יצרה אפליקציה מיוחדת (MySequelCare) שעוזרת לרפא אנשים טראומטיים ואנשים שסובלים מפחדים וחרדות.
