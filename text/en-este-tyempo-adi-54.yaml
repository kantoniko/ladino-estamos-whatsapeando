titulo: En este tyempo - Adi 54
pub: 2026.08.13
source: https://ladinokomunita.groups.io/g/main/message/76385

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 54.
    ebreo: עדי 54.
  - ladino: Avital Aldjem i Hayim Katsman estavan en la Kamareta de Abrigo eskondidos en el almaryo. Los teroristos esbrocharon las puertas i tiraron al almaryo. Hayim estava enpyes, en la parte de enkolgar. Muryo Pishin. Avital estava abokada en la parte de los tavlados. Los kurshumes no la tokaron. Los teroristos la vistyeron tres fustas (una en la kavesa, una en el pecho i una del bel para abasho), le dyeron las kriyaturas a Avital i los tomaron kon eyos a otras kazas ke avle a los moradores en ebreo i ke los konvense a salir del abrigo.
    ebreo: אביטל אלדג'ם וחיים כצמן היו בממ"ד מתחבאים בארון. המחבלים פרצו את הדלתות וירו על הארון. חיים היה בעמידה, בצד של התליה. מת מיד. אביטל הייתה מכופפת בצד של המדפים. הכדורים לא פגעו בה. המחבלים הלבישו אותה 3 חצאיות (אחת בראש, אחת בחזה ואחת מהמותניים ומטה), נתנו את הילדים לאביטל ולקחו אותם איתם לבתים אחרים בכדי שתדבר עם הדיירים בעברית ותשכנע אותם לצאת מהממ"ד...
  - ladino: La boka de madre maldize ma su pecho bendize.
    ebreo: הפה של האמא מקלל אך החזה שלה (הלב שלה) מברך.




