titulo: En este tyempo - Adi 55
pub: 2026.08.16
source: https://ladinokomunita.groups.io/g/main/message/76406

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 55.
    ebreo: עדי 55.
  - ladino: La boz de Avital estava tremblando en la kaza del los vizinos. Los vizinos no salyeron del Abrigo. Los teroristos kemaron la kaza. Eshel respiro la tizna i el umo del kemado i se empeso a aogar. Dospues de syerto tyempo los teroristos los tomaron a Avital, Negev i Eshel i se metyeron en kamino, a pye, a la direksyon de Gazza. Serka de la sivdad Rafiah no pudyeron suportar los gritos i los yoros de los chikos. No los pudiyan matar porke travaron filmos kon eyos. Los liberaron a los tres i les disheron ke tornen atras. Avital kon Eshel en la una mano en su pecho i Negev en la otra mano firido del pye kosheyando, empeso a tornar a la direksyon de Israel.
    ebreo: הקול של אביטל רעד בבית של השכנים. השכנים לא יצאו מהממ"ד. המחבלים שרפו את הבית. אשל נשם את הפיח ואת העשן של השרפה והתחיל להחנק. לאחר זמן מסויים המחבלים לקחו את אביטל, נגב ואשל ויצאו לדרך, ברגל, לכיוון עזה. בקרבת בעיר רפיח לא יכלו לסבול את הצעקות והבכי של הקטנים. לא יכלו להרוג אותם כי הסריטו סרטים איתם. שחררו את שלושתם ואמרו להם לחזור בחזרה. אביטל עם אשל ביד אחד בחזה שלה ונגב ביד שנייה פצוע ברגלו וצולע, התחילה לחזור לכיוון ישראל.
  - ladino: Se fuyeron kon pye deskalso.
    ebreo: ברחו ברגל יחפה.



