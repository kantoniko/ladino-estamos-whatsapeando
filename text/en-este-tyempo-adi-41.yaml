titulo: En este tyempo - Adi 41
pub: 2026.07.14
source: https://ladinokomunita.groups.io/g/main/message/76250

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 41.
    ebreo: עדי 41.
  - ladino: Liz i Meir Elharar teniyan ijika de 7 anyos, Adi. Noche de shabat Meir telefono a su madre, ke mora en Beer Sheva, para demanderle komo esta. Su madre le respondyo ke no se esta konsistyendo hich bueno, ke tyene penseryos i sentimyentos muy negros... Meir, ke iva pedrido a su ermano Doron en la armada antes 33 anyos, le disho a su madre "Va vinir a abrasarte i te va trayer supa". Meir viyajo 80 kilometros a Beer Sheva, le trusho supa a su madre, la abraso i torno a kibuts Holit.
    ebreo: לליז ומאיר אלחרר היתה ילדה בת 7, עדי. ערב שבת מאיר התקשר לאמא שלו, שגרה בבאר שבע, לשאול לשלומה. אימו ענתה שהיא לא מרגישה טוב בכלל, שיש לה מחשבות ורגשות רעות מאוד... מאיר, שאיבד בצבא את אחיו דורון לפני 33 שנה, אמר לאימו "אני אבוא לחבק אותך ולהביא לך מרק". מאיר נסע 80 ק"מ לבאר שבע, הביא מרק לאימו, חיבק אותה וחזר לקיבוץ חולית.
  - ladino: Al dia, a las 7:20, los teroristos entraron a sus kaza. Liz i la ijika Adi estavan en la Kamareta de Abrigo. Meir estava en la otra kamareta. Liz la enkasho a Adi al almaryo i le disho ke este kayada.
    ebreo: למחרת, ב- 7:20, הטרוריסטים נכנסו לבית שלהם. ליז והילדה עדי היו בממ"ד. מאיר היה בחדר השני. ליז הכניסה את עדי לתוך הארון ואמרה לה להיות בשקט.
  - ladino: Kayades, ke es bueno.
    ebreo: שתיקה זה טוב.



