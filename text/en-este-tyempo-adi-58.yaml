titulo: En este tyempo - Adi 58
pub: 2026.08.23
source: https://ladinokomunita.groups.io/g/main/message/76438

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 58.
    ebreo: עדי 58.
  - ladino: Adi, la eroina, estava muerta debasho de la kanape. Gerreo kon su tiro, kontra los teroristos, asta el kurshum de alkavo. Les disho a sus ijos ke se akodren ke los kere muncho bien. Mato un teroristo. Los otros la mataron a eya. Los soldados la kitaron de aya metyendo sus alma en sus palma.
    ebreo: עדי, הגיבורה, הייתה מתה מתחת לספה. נלחמה עם הרובה שלה נגד המחבלים עד לכדור האחרון. אמרה לילדים שיזכרו שהיא אוהבת אותם מאוד. הרגה מחבל. האחרים הרגו אותה. החיילים הוציאו אותה משם כשהם שמים את נפשם בכפם. 
  - ladino: Jackie, su madre, pudo tornar de Kanada solo dia de djugueves. El funeral se organizo por dia de alhad. Partisiparon syenes de personas. No kedo ojo seko. No kedo superlativo ke no fue dicho.
    ebreo: ג'אקי, אמא שלה, יכלה לחזור מקנדה רק ביום חמישי. ההלוויה נערכה ביום ראשון. השתתפו מאות בני אדם. לא נשארה עין יבשה. לא נותר סופרלטיב שלא נאמר.
  - ladino: En su tomba esta eskrito una poiziya ke Adi eskrivyo 3 mezes antes de su Muerte. Aki tenesh la poiziya kompozada por la kantadera Reaya Muskal del grupo muzikal, Alma.
    ebreo: בקבר שלה רשום שיר שעדי כתבה 3 חודשים לפני מותה. כאן יש לכם את השיר שהולחן על ידי הזמרת רעיה מוסקל מהלהקה המוזיקלית, עלמא...
  - ladino: https://www.youtube.com/watch?v=_LG0ykTRvgk
    ebreo: https://www.youtube.com/watch?v=_LG0ykTRvgk
  - ladino: Los dias pasan komo la solombra i el rikordo keda asta la tomba.
    ebreo: הימים עוברים כמו צל והזיכרון נשאר עד הקבר...


