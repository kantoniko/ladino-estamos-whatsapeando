titulo: En este tyempo - Adi 37
pub: 2026.07.05
source: https://ladinokomunita.groups.io/g/main/message/76190

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 37.
    ebreo: עדי 37.
  - ladino: La ija de Moshe Ridler, Pnina, era responsable de operar la "Sala de Operasiones" en situasyones de emerjensia. Akeya demanyana Pnina estava en la sivdad Tiberya, en la kaza de su ija. Avriyo el kontankto kon los miembros del kibuts i avriyo la aplikasyon de la kamera en la kaza de su padre ke amostrava la entrada ma no lo ke esta afitando aryentro de kaza.
    ebreo: הבת של משה רודלר, פנינה, הייתה אחראית להפעיל חמ"ל במצבי חרום. באותו בוקר פנינה הייתה בעיר טבריה, בבית של הבת שלה. פתחה את הקשר עם חברי הקיבוץ ופתחה את האפליקציה של המצלמה בביתו של אביה שמראה את הכניסה לבית אבל לא את מה שקורה בתוך הבית.
  - ladino: Yaron no estava en este grupo de komunikasyon i no saviya lo ke esta afitando.
    ebreo: ירון לא היה בקבוצה זו של הקיבוץ ולא ידע מה מתרחש.
  - ladino: Ijo fuites padre seras lo ke izites resivaras.
    ebreo: ילד היית אבא תהיה, את מה שעשית תקבל.



