titulo: En este tyempo - Adi 42
pub: 2026.07.16
source: https://ladinokomunita.groups.io/g/main/message/76267

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 42.
    ebreo: עדי 42.
  - ladino: Los teroristos entraron a la kaza de Liz i Meir, esbrocharon la Kamareta de Abrigo, tiraron kurshumes a Liz i la firyeron gravamente. Se fueron a la kamareta sigunda i echaron bomba de mano a la direksyon de Meir. Meir muryo emidyatamente.
    ebreo: הטרוריסטים נכנסו לבית של ליז ומאיר, פרצו את הממ"ד, ירו כדורים על ליז ופצעו אותה באופן חמור. הלכו לחדר השני וזרקו רימון לכיוונו של מאיר. מאיר מת באופן מיידי.
  - ladino: Entremyentes Liz, kon sus fuersas de alkavo se arasto enbasho, se arimo a la puerta del almaryo (para ke los teroristos no lo avran) i dyo su reflo de alkavo. Adi no kito boz aryentro del almaryo i los teroristos salyeron de kaza.
    ebreo: בינתיים ליז, בכוחותיה האחרונים גררה את עצמה בריצפה, נשענה על הדלת של הארון (בכדי שהטרוריסטים לא יפתחו אותו) ונתנה את נשמתה האחרונה. עדי לא הוציאה קול בתוך הארון והמחבלים יצאו מהבית.
  - ladino: Ken a buen arvole se arima, buena solombra lo kuvija.
    ebreo: מי שנשען על עץ טוב, צל טוב מכסה אותו.


