titulo: En este tyempo - Adi 45
pub: 2026.07.23
source: https://ladinokomunita.groups.io/g/main/message/76299

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 45.
    ebreo: עדי 45.
  - ladino: Moti Kakun era polis investigador. Les disho a su mujer Ina i a sus tres kriyaturas Lihi, May i Mihael ke se eskondan debasho de la kama, en la Kamareta de Abrigo. En la Kamareta de Abrigo no aviya puerta, no alkansaron a adovarla. Moti aspero detras de la pared kon el revolver en la mano. Lo tiro al primer teroristo ke entro a kaza i lo mato. Los otros teroristos tiraron a kaza i echaron bomba de mano a la direksyon de Moti. Moti le dyo una punta de pye a la bomba i la arondjo atras. Los teroristos metyeron eksplosivo en la ventana de la Kamareta de Abrigo. La eksplozyon estava muy fuerte.
    ebreo: מוטי קקון היה שוטר חוקר. הוא אמר לאישתו אינה ולשלושת ילדיו ליהיא, מאי ומיכאל שיתחבו מתחת למיטה בממ"ד. בממ"ד לא היה דלת, לא הספיקו לתקן אותה. מוטי חיכה מאחורי הקיר עם האקדח ביד. ירה על מחבל ראשון שנכנס הביתה והרג אותו. המחבלים האחרים ירו לתוך הבית וזרקו רימון לכיוונו של מוטי. מוטי נתן בעיטה לרימון ודחך אותו בחזרה. המחבלים שמו חומר נפץ לחלון של הממ"ד. הפיצוץ היה חזק מאוד.
  - ladino: El ombre da paredes i tavan, la mujer da el nido.
    ebreo: הגבר נותן קירות ותקרה, האישה נותנת את הקן.


