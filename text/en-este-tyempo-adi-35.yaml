titulo: En este tyempo - Adi 35
pub: 2026.06.30
source: https://ladinokomunita.groups.io/g/main/message/76160

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 35.
    ebreo: עדי 35.
  - ladino: El koordinador del grupo de seguridad del kibuts, Avraham Korin, i el shef del ekipo de emerjensiya Shimon Azulay (Kish) tomaron sus tiros i salyeron a gerrear kon los teroristos. A defender a los miembros del kibuts. Avraham teniya 56 anyos. Kazado kon tres kriaturas, triyizos. Vino de Arjentina, de edad de 20 anyos, kon un "Grano de Tsionistos" i se instalo en Kibuts Holit. Era uno de los fundadores del projekto de "Kashas de Nido" en el kibutz para las kukuvayas, ke aprovechavan a la agrikultura.
    ebreo: הרבש"ץ של הקיבוץ, אברהם קורין, וראש צוות חרום שמעון אזולאי (קיש) לקחו את הרובים שלהם ויצאו להילחם נגד הטרוריסטים. להגן על חברי הקיבוץ. אברהם היה בן 56. נשוי עם שלושה ילדים, שלישיה. הגיע מארגנטינה, בגיל 20, עם "גרעין של ציונים" והתיישב בקיבוץ חולית. היה אחד המייסדים של "תיבות קינון" בקיבוץ לתנשמות, שמביאות תועלת לחקלאות.
  - ladino: Malorozamente, los teroristos lo tiraron i lo mataron.
    ebreo: לרוע המזל, המחבלים ירו בו והרגו אותו.
  - ladino: La paz fragua nidos, la gerra los destruye.
    ebreo: השלום בונה קנים, המלחמה הורסת אותם.

