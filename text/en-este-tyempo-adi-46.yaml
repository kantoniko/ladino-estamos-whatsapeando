titulo: En este tyempo - Adi 46
pub: 2026.07.26
source: https://ladinokomunita.groups.io/g/main/message/76315

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 46.
    ebreo: עדי 46.
  - ladino: La ventana se arranko de su luguar, la kaza entera se se meneo. Lihi, debasho de la kama, se firyo gravamente de su kavesa. No estava reaksyonando i no estava respirando. Moti i Ina la tomaron a la otra kamareta, la bandajaron i empesaron a arrebivirla kon apretar el pecho. Dospues de muy largo tyempo le torno a Lihi el reflo ma no la konosensya. 10 oras asperaron kon Lihi desmayada, asta ke vino la armada.
    ebreo: החלון נתלש ממקומו. הבית כולו רעד. ליהיא, מתחת למיטה, נפצעה באופן חמור בראשה. לא הגיבה ולא נשמה. מוטי ואינה לקחו אותה לחדר השני, חבשו אותה והתחילו בהחייאה עם לחיצות בחזה. אחרי זמן ארוך מאוד חזרה לליהיא הנשימה אך לא ההכרה. 10 שעות חיכו עם ליהיא מעולפת עד שהגיעה הצבא.
  - ladino: La vida de Lihi se salvo.
    ebreo: החיים של ליהיא ניצלו.
  - ladino: Del sielo ke no se menea, nada se puede saver.
    ebreo: משמיים שלא זזים, שום דבר אי אפשר לדעת.



