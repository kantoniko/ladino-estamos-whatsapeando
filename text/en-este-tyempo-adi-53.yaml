titulo: En este tyempo - Adi 53
pub: 2026.08.11
source: https://ladinokomunita.groups.io/g/main/message/76380

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 53.
    ebreo: עדי 53.
  - ladino: Los teroristos kitaron a las kriyaturas al kortijo i se asentaron. Negev estava firido del pye. El kurshum le entro de la una vanda del pye i le salyo de la otra vanda. Los teroristos lo bandajaron, le dyeron agua i lo forsaron ke diga "Bismillah". Travaron filmos ke "amostran sus umanidades" kon los ijikos. Se "repozaron" aya kaji ora i medya. Tomaron a las kriyaturas i kontinuaron a la kaza de Avital Aladjem.
    ebreo: המחבלים הוציאו את הילדים לחצר וישבו. נגב היה פצוע ברגלו. הכדור נכנס מצד אחד של הרגל ויצא מצד שני. המחבלים חבשו אותו, נתנו לו מים והכריחו אותו לומר "ביסמיללאה". הסריטו סרטונים ש"מראים את ההומניות שלהם" עם הילדים. "נחו" שם כשעה וחצי. לקחו את הילדים והמשיכו לבית של אביטל אלדג'ם...
  - ladino: Dar kon las manos, tomar kon los piezes.
    ebreo: לתת בידיים, לקחת ברגליים...


