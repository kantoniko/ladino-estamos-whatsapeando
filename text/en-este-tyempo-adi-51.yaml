titulo: En este tyempo - Adi 51
pub: 2026.08.06
source: https://ladinokomunita.groups.io/g/main/message/76358

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 51.
    ebreo: עדי 51.
  - ladino: La ora ya estava 20.00 de la tadre. Todo estava areskuro. Le disheron a Yaron "No ay kualo azer aki, probablamente Adi i los inyetos estan arrevatados en Gazza, torna a tu kaza". Las ventanas del otomobil de Yaron estavan rotas. Yaron viyajo sin ventanas a su ija Liat en Modiin.
    ebreo: בשעה 20.00 של הערב. הכל היה חשוך. אמרו לירון "אין מה לעשות כאן, סביר להניח שעדי והנכדים חטופים בעזה, תחזור הביתה". החלונות של האוטו של ירון היו שבורים. ירון נסע בלי חלונות לביתה ליאת במודיעין...
  - ladino: En viyajando a Modiin Yaron aresivyo un telefon dizyendo ke los inyetos Negev i Eshel estan en kibuts Gvulot. Negev esta firido de su pye. Eshel tyene problem kon el respirar. Anani esta en kamino para tomar a los ijos. Adi no se save ande esta.
    ebreo: תוך כדי נסיעה למודיעין ירון קיבל טלפון שבו נאמר שהנכדים נגב ואשל נמצאים בקיבוץ גבולות. נגב פצוע ברגלו. לאשל יש בעיות עם הנשימה. ענני בדרך לקחת את הילדים. עדי לא ידוע איפה היא.
  - ladino: La korona de los viejos es los inietos.
    ebreo: הכתר של המבוגרים הוא הנכדים.


