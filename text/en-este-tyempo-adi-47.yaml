titulo: En este tyempo - Adi 47
pub: 2026.07.28
source: https://ladinokomunita.groups.io/g/main/message/76321

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 47.
    ebreo: עדי 47.
  - ladino: Lili Kaisman era miembra del kibuts desde muncho tyempo. Kerida por todos. A las 7:45 su ija, Hen, aresivyo el ultimo mesaj de telefon de su madre dizyendo ke los teroristos desbrocharon la kaza, la tiraron i estan kemando la kaza. Lili muryo en poko tyempo.
    ebreo: לילי קייסמן הייתה חברת קיבוץ מזה זמן רב. אהובה על כולם. ב- 7:45 ביתה, חן, קיבלה את הודעת הטלפון האחרונה מאימה האומר שהמחבלים פרצו לבית, ירו בה ושורפים את הבית. לילי מתה תוך זמן קצר.
  - ladino: Anani, Ahuvya i sus grupo de 30 mansevos kontinuaron a eskondesen en los kampos. Anani mando mesajes a la armada ke vengan a tomarlos i a salvarlos, no aviya repuesta. Algunos partisipantes del festival, ke aprovaron a tornar de aya kon sus otomobiles, fueron tirados i matados en el kamino.
    ebreo: ענני, אהוביה והקבוצה שלהם בת 30 צעירים המשיכו להתחבא בשדות. ענני שלח הודעות לצבא שיבואו לקחת אותם ולהציל אותם, לא הייתה תשובה. חלק ממשתתפי הפסטיבל שניסו לחזור משם ברכביהם נורו ונהרגו בדרך.
  - ladino: El Dio aprova a los buenos. al padre aresentado da ijo alokado.
    ebreo: אלוהים מנסה (מעמיד במבחן) את הטובים. לאבא המיושב נותן בן משוגע.


