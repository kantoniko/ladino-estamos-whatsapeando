titulo: En este tyempo - Adi 50
pub: 2026.08.04
source: https://ladinokomunita.groups.io/g/main/message/76348

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 50.
    ebreo: עדי 50.
  - ladino: A las 17.30 vinyeron los soldados israelyanos. Se fueron kon Yaron endjuntos a la kaza de Adi. La kaza estava yena de vainas de kurshumes. Embasho aviya un teroristo muerto kon roketa RPG en la aldikera. La puerta del abrigo estava burakada entera. Yaron avriyo la Puerta de Abrigo i eskapo de murir por sigunda ves. La puerta estava minada kon bomba de mano ma la bomba no se eksplozo. Dos miraklos en un dia. Aryentro estava todo de ariva abasho. Las paredes yenas de burakos de kurshumes. El kanape al areves, el almaryo kayido a la kanape, la kama del bebe al areves, todos los vistidos enbasho, el Kondisyonador del Ayre arankado de la pared.
    ebreo: בשעה 17.30 הגיעו החיילים הישראליים. הלכו יחד עם ירון לביתה של עדי. הבית היה מלא תרמילי כדורים. על הרצפה היה מחבל מת עם רקטת RPG בכיס. הדלת של הממ"ד הייתה מחוררת כולה. ירון פתח את דלת הממ"ד וניצל ממוות בפעם השנייה. הדלת הייתה ממולכדת ברימון אך הרימון לא התפוצץ. שני נסים באותו יום. בפנים הכל היה הפוך. הקירות מלאים בחורים של כדורים. הספה הפוכה, הארון נפול על הספה, מיטת תינוק הפוכה. כל הבגדים על הרצפה, המזגן עקור מהקיר.
  - ladino: Bushkaron en la kaza entera, Adi i los inyetos no estavan en kaza.
    ebreo: חיפשו בכל הבית, עדי והנכדים לא היו בבית.
  - ladino: Al areves te lo digo para ke me entyendas.
    ebreo: אנו אומר לך במהופך בכדי שתבין.


