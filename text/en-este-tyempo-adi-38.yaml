titulo: En este tyempo - Adi 38
pub: 2026.07.07
source: https://ladinokomunita.groups.io/g/main/message/76197

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 38.
    ebreo: עדי 38.
  - ladino: Los teroristos tiraron a las ventanas de la kaza de Ahuvya i Tehila, desbrocharon la Puerta de kaza, desbrocharon la puerta de la kamareta de Abrigo, tiraron a Tehila i tiraron al perro "loka". Tehila muryo. El perro se fuyo de kaza kon el kurshum en su puerpo. Los vidros del otomobil de Tehila estavan rotos de los tiros de los teroristos. Loka entro eryentro i se eskondyo debasho del banko de atras. Asta oy bive kon el kurshum en su puerpo.
    ebreo: הטרוריסטים ירו לחלונות של הבית של אהוביה ותהילה, פרצו את דלת הבית, פרצו את הדלת של בממ"ד, ירו בתהילה וירו בכלב "לוקה" (משוגעת). תהילה נהרגה. הכלב ברח מהבית עם הכדור בגופו. הזכוכיות ברכב של תהילה היו שבורות מהיריות של הטרוריסטים. לוקה נכנס פנימה והסתתר מתחת לספסל האחורי. עד היו הוא חי עם הכדור בגופו.
  - ladino: Mas poko saver, salud para el puerpo.
    ebreo: פחות לדעת, בריאות לגוף.


