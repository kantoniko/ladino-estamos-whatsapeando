titulo: En este tyempo - Adi 40
pub: 2026.07.12
source: https://ladinokomunita.groups.io/g/main/message/76241

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi 40.
    ebreo: עדי 40.
  - ladino: Shahar le disho a su ijo Rotem ke se espande entre la pared i la kama i eya se echo enriva de su ijo, dizyendole ke lo kere bien. Los teroristos kemaron el salon de kaza, eksplozaron la Puerta del Abrigo i echaron bomba de mano aryentro. Shahar i Shlomi muryeron. Los teroristos no lo vyeron a Rotem. Rotem se firyo de su ojo, de su tripa i de su pye. Oyo a su padre i su madre dando sus ultimos reflos. Kaji una ora no se meneyo debasho de su madre, muerta, ke lo salvo. Kedo en kaza 11 oras, asta las 17:30 de la tadre, asta ke la armada israelyana entro al kibuts.
    ebreo: שחר אמרה לבנה רותם שישכב בין הקיר למיטה והיא שכבה מעל בנה, באומרה שהיא אוהבת אותו. הטרוריסטים שרפו את סלון הבית, פוצצו את דלת הממ"ד וזרקו רימון לתוכו. שחר ושלומי נהרגו. הטרוריסטים לא ראו את רותם. רותם נפצע בעינו, בבטנו וברגלו. שמע את אביו ואת אימו נותנים את נשימתם האחרונה. כ- שעה לא זז מתחת לאימו, המתה, שהצילה אותו. נשאר בבית 11 שעות, עד 17:30 של הערב, עד שהצבא הישראלי נכנס לקיבוץ.
  - ladino: Rotem i sus ermanas kedaron en vida.
    ebreo: רותם ואחיותיו נותרו בחיים.
  - ladino: Kavesa firida se sana, korason firido nunka.
    ebreo: ראש פצוע אפשר לרפא, לב פצוע לעולם לא.


