titulo: En este tyempo - Adi fin
pub: 2026.08.30
source: https://ladinokomunita.groups.io/g/main/message/76459

teksto:
  - ladino: En este tyempo.
    ebreo: בזמן הזה.
  - ladino: Adi fin.
    ebreo: עדי סוף.
  - ladino: La famiya Vital Kaplun amostran eroismo i bravura superyores. En luguar de kayersen en dolyo, desidaron a difundir la buendad i la ermozura ke Adi, db"m, trusho al mundo. Estan engrandesyendo a los guerfanos kon amor grande, kontinuando a lavorar la tyerra i viyajando por el mundo entero para kontar la kontribusyon i el eroismo de Adi. Estan sanando el firido en sus korasones.
    ebreo: משפחת ויטל קפלון מציגה גבורה ואומץ עילאיים. במקום ליפול (לשקוע) באבל הם בוחרו להפיץ את הטוב ואת היפה שעדי ז"ל הביאה לעולם. הם מגדלים את היתומים באהבה רבה, ממשיכים את עבודת האדמה ומסתובבים בעולם כולו על מנת לספר על תרומתה וגבורתה של עדי. הם מרפאים את הפצע שבליבם.
  - ladino: "Anani kriyo una fundasyon a la memorya de Adi en benefisyo de sus ijos, guerfanos de madre, ke sufren traumas inolvidavles i ke estas traumas los van a akompanyar por muchos anyos. Kualken persona ke dezea donar a esta fundasyon puede azerlo en el sityo:"
    ebreo: "ענני הקים קרן לזכרה של עדי ז\"ל לטובת ילדיהם, היתומים מאם, שסובלים מטראומות בלתי נשכחות ושטראומות אלה ילוו  אותם שנים רבות. מי שרוצה לתרום לקרן יכול לעשות זאת באתר:"
  - ladino: https://www.jgive.com/new/he/ils/donation-targets/123673/recent-donations
    ebreo: https://www.jgive.com/new/he/ils/donation-targets/123673/recent-donations
  - ladino: Kuando el guerfano se alegra, las piedras de la kaye se meten a yorar.
    ebreo: כאשר היתום שמח, אבני הרחוב בוכות.



